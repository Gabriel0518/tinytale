<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TinyTale Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(239, 68, 68, 0.2), transparent 36%),
          linear-gradient(180deg, #141414, #09090b 72%);
        color: #ffffff;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .card {
        width: min(100%, 420px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        padding: 28px 24px;
        background: rgba(11, 15, 25, 0.8);
        backdrop-filter: blur(18px);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      }

      .logo {
        width: 144px;
        height: auto;
      }

      h1 {
        margin: 20px 0 10px;
        font-size: 28px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.72);
        line-height: 1.7;
      }

      .actions {
        display: grid;
        gap: 12px;
        margin-top: 24px;
      }

      .button {
        appearance: none;
        border: 0;
        border-radius: 16px;
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
      }

      .button-primary {
        background: #dc2626;
        color: #ffffff;
      }

      .button-secondary {
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/logo.png" alt="TinyTale" />
      <h1>You're offline</h1>
      <p>TinyTale can reopen as soon as your connection comes back. You can retry now or jump back to the home screen if cached content is available.</p>
      <div class="actions">
        <button class="button button-primary" type="button" onclick="window.location.reload()">Try again</button>
        <a class="button button-secondary" href="/">Go to home</a>
      </div>
    </main>
  </body>
</html>
