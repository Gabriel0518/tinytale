<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-dim": "#0b0d10",
              "secondary-fixed-dim": "#2C2F36",
              "on-error-container": "#FFFFFF",
              "on-surface": "#FFFFFF",
              "surface-variant": "#1c1f26",
              "secondary-dim": "#ef779f",
              "surface-container-high": "#25282e",
              "on-background": "#FFFFFF",
              "background": "#0f1115",
              "tertiary-fixed-dim": "#FFD700",
              "on-secondary": "#FFFFFF",
              "tertiary-fixed": "#FFD700",
              "primary-container": "rgba(255, 59, 92, 0.2)",
              "tertiary-container": "rgba(255, 215, 0, 0.2)",
              "surface-container-lowest": "#050608",
              "surface": "#0f1115",
              "secondary": "#2C2F36",
              "on-tertiary-fixed-variant": "#000000",
              "secondary-container": "#1c1f26",
              "on-tertiary": "#000000",
              "tertiary": "#FFD700",
              "inverse-primary": "#FF3B5C",
              "surface-tint": "#FF3B5C",
              "error": "#CF6679",
              "tertiary-dim": "#b08af6",
              "primary-dim": "#ff6f7c",
              "on-secondary-fixed-variant": "#9CA3AF",
              "outline-variant": "rgba(255, 255, 255, 0.1)",
              "secondary-fixed": "#2C2F36",
              "surface-container-low": "#15181e",
              "on-secondary-container": "#9CA3AF",
              "on-error": "#000000",
              "on-secondary-fixed": "#FFFFFF",
              "on-primary": "#FFFFFF",
              "surface-container": "#1c1f26",
              "surface-container-highest": "#2c2f36",
              "primary-fixed-dim": "#FF3B5C",
              "outline": "#414753",
              "on-tertiary-container": "#FFD700",
              "error-dim": "#d53d18",
              "on-tertiary-fixed": "#000000",
              "on-primary-fixed-variant": "#FFFFFF",
              "primary": "#FF3B5C",
              "on-primary-container": "#FF3B5C",
              "on-primary-fixed": "#FFFFFF",
              "surface-bright": "#2c2f36",
              "primary-fixed": "#FF3B5C",
              "error-container": "#B00020",
              "inverse-surface": "#FFFFFF",
              "inverse-on-surface": "#0f1115",
              "on-surface-variant": "#9CA3AF"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Plus Jakarta Sans"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
      }
      body {
        height: 100dvh;
        overflow: hidden;
      }
      .input-field {
        background-color: transparent !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
      }
      .input-field:focus {
        border-color: #FF3B5C !important;
        box-shadow: none !important;
      }
    </style>
</head>
<body class="bg-background font-body text-on-surface selection:bg-primary selection:text-on-primary antialiased">
<!-- Header with Close Button -->
<header class="fixed top-0 w-full z-50 flex items-center justify-end px-6 py-4">
<button class="active:scale-95 transition-transform">
<span class="material-symbols-outlined text-white/50 hover:text-white transition-colors">close</span>
</button>
</header>
<main class="h-full w-full flex flex-col px-8 pt-20 overflow-y-auto">
<div class="w-full max-w-sm mx-auto flex flex-col">
<!-- Header Section -->
<div class="mb-10">
<h1 class="text-3xl font-bold tracking-tight text-on-surface mb-2">Sign In</h1>
<p class="text-on-surface-variant text-sm">Welcome back you've been missed</p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-6">
<!-- Email ID -->
<div class="space-y-2">
<label class="text-sm font-semibold text-on-surface">Email ID</label>
<input class="input-field w-full h-12 rounded-lg px-4 text-sm text-on-surface placeholder:text-on-surface-variant/40 outline-none transition-all" placeholder="Enter Email ID" type="email"/>
</div>
<!-- Password -->
<div class="space-y-2">
<label class="text-sm font-semibold text-on-surface">Password</label>
<div class="relative">
<input class="input-field w-full h-12 rounded-lg pl-4 pr-12 text-sm text-on-surface placeholder:text-on-surface-variant/40 outline-none transition-all" placeholder="Enter Password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer">
<div class="relative flex items-center">
<input class="peer h-4 w-4 rounded border-outline-variant bg-transparent text-primary focus:ring-primary/20" type="checkbox"/>
</div>
<span class="text-xs text-on-surface">Remember Me</span>
</label>
<a class="text-xs font-medium text-on-surface hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Sign In Button -->
<button class="w-full h-12 mt-4 bg-on-surface text-background text-sm font-bold rounded-lg hover:opacity-90 active:scale-[0.98] transition-all" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-10">
<div class="h-[1px] flex-1 bg-outline-variant/20"></div>
<span class="text-xs text-on-surface-variant font-medium">Or with</span>
<div class="h-[1px] flex-1 bg-outline-variant/20"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 h-12 bg-transparent border border-outline-variant/20 rounded-lg hover:bg-white/[0.05] transition-all active:scale-95">
<svg class="w-5 h-5 text-[#1877F2]" fill="currentColor" viewbox="0 0 24 24">
<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
</svg>
<span class="text-sm font-medium">Facebook</span>
</button>
<button class="flex items-center justify-center gap-3 h-12 bg-transparent border border-outline-variant/20 rounded-lg hover:bg-white/[0.05] transition-all active:scale-95">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-medium">Google</span>
</button>
</div>
<!-- Sign Up Prompt -->
<p class="text-center text-sm text-on-surface-variant mt-auto py-8">
                Don't have an account? <a class="text-on-surface font-bold hover:text-primary transition-colors underline" href="#">Sign Up</a>
</p>
</div>
</main>
</body></html>
