<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TinyTale Native Shell</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: #141414;
        color: #ffffff;
        font-family: "Plus Jakarta Sans", Inter, "SF Pro Display", "Avenir Next", "Helvetica Neue", sans-serif;
      }

      #native-launch-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 20px;
        background:
          radial-gradient(circle at top, rgba(255, 59, 92, 0.18), transparent 32%),
          radial-gradient(circle at bottom, rgba(255, 216, 77, 0.08), transparent 24%),
          linear-gradient(180deg, #18110f 0%, #111318 28%, #0b0c10 100%);
        opacity: 1;
        visibility: visible;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #native-launch-screen.native-launch-screen-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .native-launch-panel {
        width: min(100% - 32px, 420px);
        padding: 30px 24px 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 32px;
        background:
          linear-gradient(180deg, rgba(31, 21, 18, 0.96), rgba(15, 17, 21, 0.98)),
          rgba(19, 23, 32, 0.96);
        box-shadow:
          0 26px 80px rgba(0, 0, 0, 0.46),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
        text-align: center;
        backdrop-filter: blur(10px);
      }

      .native-launch-logo-wrap {
        display: flex;
        justify-content: center;
        margin: 0 auto 18px;
      }

      .native-launch-logo {
        width: min(220px, 72vw);
        height: auto;
        filter: drop-shadow(0 18px 38px rgba(0, 0, 0, 0.4));
      }

      .native-launch-kicker {
        margin: 0;
        color: rgba(255, 255, 255, 0.52);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .native-launch-headline {
        margin: 14px 0 0;
        font-size: 32px;
        line-height: 1.02;
        letter-spacing: -0.045em;
      }

      .native-launch-detail {
        margin: 14px 0 0;
        color: rgba(255, 255, 255, 0.66);
        line-height: 1.55;
        font-size: 14px;
      }

      .native-launch-highlight {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.78);
        font-size: 12px;
      }

      .native-launch-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(135deg, #ffd84d, #ff3b5c);
        box-shadow: 0 0 0 4px rgba(255, 59, 92, 0.12);
      }

      .native-launch-progress {
        position: relative;
        margin-top: 24px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .native-launch-progress-bar {
        position: absolute;
        inset: 0;
        width: 36%;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(255, 216, 77, 0.18), #ff3b5c, rgba(255, 216, 77, 0.18));
        animation: nativeLaunchBar 1.4s ease-in-out infinite;
      }

      .native-launch-footnote {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
        color: rgba(255, 255, 255, 0.46);
        font-size: 11px;
      }

      @keyframes nativeLaunchBar {
        0% {
          transform: translateX(-110%);
        }

        100% {
          transform: translateX(260%);
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BOb_Xoh9.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-B9HgroB4.css">
  </head>
  <body>
    <div id="native-launch-screen" aria-hidden="true">
      <div class="native-launch-panel">
        <div class="native-launch-logo-wrap">
          <img class="native-launch-logo" src="/ui/logo-mobile.png" alt="TinyTale" />
        </div>
        <p class="native-launch-kicker">Premium Vertical Stories</p>
        <h1 class="native-launch-headline">Your next episode is almost ready.</h1>
        <p class="native-launch-detail">Warming up recommendations, artwork, and playback so the home feed lands fully dressed.</p>
        <div class="native-launch-highlight">
          <span class="native-launch-dot"></span>
          <span>Brand launch hold: 3 seconds</span>
        </div>
        <div class="native-launch-progress">
          <span class="native-launch-progress-bar"></span>
        </div>
        <div class="native-launch-footnote">
          <span>TinyTale Original</span>
          <span>North America launch shell</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
