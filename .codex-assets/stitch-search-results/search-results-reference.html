<body class="text-on-surface select-none antialiased">

<header class="fixed top-0 w-full z-50 bg-[#0f1115]/85 backdrop-blur-xl bg-gradient-to-b from-[#0f1115] to-transparent shadow-2xl">

<span class="text-2xl font-extrabold tracking-tighter text-[#FF3B5C] uppercase font-['Plus_Jakarta_Sans']">VELVET</span>
</div>
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform text-white/70 hover:text-white">
<span class="material-symbols-outlined text-2xl" data-icon="search">search</span>
</button>
</div>
</div>
</header>
<main class="pt-20 pb-24 px-4">
<!-- Search Input Bar (Floating/High Surface) -->

<div class="relative group">

<span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="search">search</span>
<button class="absolute right-4 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center bg-white/10 rounded-full text-on-surface-variant">
<span class="material-symbols-outlined text-lg" data-icon="close">close</span>
</button>
</div>
</section>
<!-- Filters & Sorting (Pill Based) -->
<section class="mb-8">
<div class="flex gap-2 overflow-x-auto hide-scrollbar -mx-4 px-4">
<button class="whitespace-nowrap px-6 py-2 rounded-full bg-white text-surface font-bold text-xs uppercase tracking-wider transition-all">All Results</button>
<button class="whitespace-nowrap px-6 py-2 rounded-full bg-surface-container-highest text-on-surface font-bold text-xs uppercase tracking-wider hover:bg-white/10 transition-all">Movies</button>
<button class="whitespace-nowrap px-6 py-2 rounded-full bg-surface-container-highest text-on-surface font-bold text-xs uppercase tracking-wider hover:bg-white/10 transition-all">Series</button>
<button class="whitespace-nowrap px-6 py-2 rounded-full bg-surface-container-highest text-on-surface font-bold text-xs uppercase tracking-wider hover:bg-white/10 transition-all flex items-center gap-2">
                    Filters <span class="material-symbols-outlined text-sm" data-icon="tune">tune</span>
</button>
</div>
</section>
<!-- Search Results Grid (2-Column Bento) -->

<div class="flex items-baseline justify-between mb-4">
<h2 class="text-xl font-bold font-headline tracking-tight">Results for 'Midnight'</h2>

<div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
<div class="absolute bottom-0 p-3 w-full">

<h3 class="text-sm font-bold leading-tight">Midnight Pulse</h3>
<div class="flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[10px] text-tertiary" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="text-[10px] font-bold text-on-surface-variant">8.9</span>
</div>
</div>
</div>
<!-- Result Card 2 -->

<img class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" data-alt="moody portrait of a mysterious figure standing under a single street lamp in a foggy dark alleyway" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDmtXqsUQ7mMbHWM8sT7aZf6pZWAsVqqxxMjCOuPzJqhxGdISkCxknfVwIg_lgYRze47CJoOzD6MJIwIjfAAknQUhVPMqewwI2pBp96RzffR2BNUsVa2XGxE82KG1170RAJqo9fOJJid8LAcV1YNnZJzXwx6IzEUZV4lOpDO3K7i_agSZKpC1lNGkKfkRGhBvCwsweBWwYEV_eeJ0FEfnwUGczdrWgpJr728816axudie_Y6BQauy7yjYgQ2RMCMAzeOGdsI_V2iKk"/>
<div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
<div class="absolute bottom-0 p-3 w-full">
<span class="inline-block px-2 py-0.5 rounded bg-blue-600 text-[10px] font-extrabold text-white mb-2 uppercase">Series</span>
<h3 class="text-sm font-bold leading-tight">The Midnight Club</h3>
<div class="flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[10px] text-tertiary" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="text-[10px] font-bold text-on-surface-variant">7.4</span>
</div>
</div>
</div>
<!-- Result Card 3 -->
<div class="group relative aspect-[2/3] rounded-xl overflow-hidden bg-surface-container shadow-lg">

<div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>

<div class="flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[10px] text-tertiary" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="text-[10px] font-bold text-on-surface-variant">9.2</span>
</div>
</div>
</div>

<div class="group relative aspect-[2/3] rounded-xl overflow-hidden bg-surface-container shadow-lg">
<div class="absolute inset-0 flex items-center justify-center p-4 bg-surface-container-highest">
<div class="text-center">
<span class="material-symbols-outlined text-4xl text-white/20 mb-2" data-icon="slow_motion_video">slow_motion_video</span>
<p class="text-[10px] font-bold uppercase tracking-widest text-white/40">Loading More</p>
</div>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full h-16 flex justify-around items-center px-4 bg-[#0f1115]/85 backdrop-blur-xl border-t border-white/10 shadow-[0_-10px_20px_rgba(0,0,0,0.5)] z-50 pb-safe">
<button class="flex flex-col items-center justify-center text-white/40 hover:text-white/90 active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-['Plus_Jakarta_Sans'] text-[10px] font-bold uppercase mt-1">home</span>

<button class="flex flex-col items-center justify-center text-[#FF3B5C] drop-shadow-[0_0_8px_rgba(255,59,92,0.6)] scale-110 active:scale-90 transition-all duration-200">

<button class="flex flex-col items-center justify-center text-white/40 hover:text-white/90 active:scale-90 transition-all duration-200">

<span class="material-symbols-outlined" data-icon="person">person</span>
