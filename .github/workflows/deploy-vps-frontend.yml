name: Deploy Frontend to VPS (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (commit SHA, tag, or branch)"
        required: false
        default: "main"
      skip_purge:
        description: "Skip Cloudflare purge"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: vps-frontend-production
      cancel-in-progress: false

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_FRONTEND_PATH: ${{ secrets.VPS_FRONTEND_PATH }}
      VPS_PM2_FRONTEND_APP: ${{ secrets.VPS_PM2_FRONTEND_APP }}
      VPS_FRONTEND_HEALTHCHECK_URL: ${{ secrets.VPS_FRONTEND_HEALTHCHECK_URL }}
      VPS_SSH_PRIVATE_KEY_PRESENT: ${{ secrets.VPS_SSH_PRIVATE_KEY != '' }}

    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=()

          for key in VPS_HOST VPS_SSH_USER VPS_FRONTEND_PATH; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${VPS_SSH_PRIVATE_KEY_PRESENT}" != "true" ]; then
            missing+=("VPS_SSH_PRIVATE_KEY")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

          echo "SSH_PORT=${VPS_SSH_PORT:-22}"
          echo "PM2_APP=${VPS_PM2_FRONTEND_APP:-tinytale-web}"
          echo "HEALTH_URL=${VPS_FRONTEND_HEALTHCHECK_URL:-http://127.0.0.1:7001/zh}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "${VPS_SSH_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy frontend to VPS with rollback
        env:
          DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}
        run: |
          set -euo pipefail

          SSH_PORT="${VPS_SSH_PORT:-22}"
          PM2_APP="${VPS_PM2_FRONTEND_APP:-tinytale-web}"
          HEALTH_URL="${VPS_FRONTEND_HEALTHCHECK_URL:-http://127.0.0.1:7001/zh}"

          ssh -p "$SSH_PORT" "$VPS_SSH_USER@$VPS_HOST" \
            "VPS_FRONTEND_PATH='$VPS_FRONTEND_PATH' PM2_APP='$PM2_APP' HEALTH_URL='$HEALTH_URL' DEPLOY_REF='$DEPLOY_REF' bash -s" <<'EOF'
          set -Eeuo pipefail

          cd "$VPS_FRONTEND_PATH"

          if [ ! -d .git ]; then
            echo "VPS_FRONTEND_PATH is not a git repository: $VPS_FRONTEND_PATH"
            exit 1
          fi

          PREV_SHA="$(git rev-parse HEAD)"
          echo "Current frontend SHA: $(git rev-parse --short "$PREV_SHA")"

          rollback() {
            local line="${1:-unknown}"
            trap - ERR

            echo "Deployment failed at line $line. Rolling back to $(git rev-parse --short "$PREV_SHA")"
            git reset --hard "$PREV_SHA" || true
            npm ci --no-audit --no-fund || true
            npm run build || true
            pm2 reload "$PM2_APP" --update-env || pm2 restart "$PM2_APP" --update-env || true
            exit 1
          }

          trap 'rollback $LINENO' ERR

          git fetch --prune origin

          # Prefer remote branch refs to avoid deploying stale local branches.
          if git show-ref --verify --quiet "refs/remotes/origin/${DEPLOY_REF}"; then
            DEPLOY_REF="origin/${DEPLOY_REF}"
          elif ! git cat-file -e "${DEPLOY_REF}^{commit}" 2>/dev/null; then
            echo "DEPLOY_REF ${DEPLOY_REF} not found; fallback to origin/main"
            DEPLOY_REF="origin/main"
          fi

          TARGET_SHA="$(git rev-parse --short "$DEPLOY_REF")"
          echo "Deploying target SHA: $TARGET_SHA"

          git reset --hard "$DEPLOY_REF"
          npm ci --no-audit --no-fund
          npm run build
          pm2 reload "$PM2_APP" --update-env || pm2 restart "$PM2_APP" --update-env

          passed=0
          for attempt in 1 2 3 4 5; do
            status="$(curl -o /dev/null -s -w '%{http_code}' --max-time 10 "$HEALTH_URL" || true)"
            if [ "$status" = "200" ] || [ "$status" = "301" ] || [ "$status" = "302" ] || [ "$status" = "307" ] || [ "$status" = "308" ]; then
              passed=1
              echo "Health check passed (HTTP $status)"
              break
            fi

            echo "Health check attempt $attempt failed (HTTP $status), retrying..."
            sleep 5
          done

          if [ "$passed" -ne 1 ]; then
            echo "Health check failed after deployment"
            exit 1
          fi

          trap - ERR
          echo "Frontend deploy finished: $(git rev-parse --short HEAD)"
          EOF

      - name: Purge Cloudflare cache (optional)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_purge != 'true' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ZONE_ID:-}" ]; then
            echo "CF_API_TOKEN or CF_ZONE_ID not set, skipping purge"
            exit 0
          fi

          response="$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"

          echo "$response"
          if ! echo "$response" | rg '"success":true' >/dev/null; then
            echo "Cloudflare purge failed, continuing without blocking deployment"
            exit 0
          fi

      - name: Smoke check public site
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://tinytale.top/zh >/dev/null
          echo "Public smoke check passed"
