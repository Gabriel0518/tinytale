name: Deploy Frontend to VPS (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (commit SHA, tag, or branch)"
        required: false
        default: "main"
      skip_purge:
        description: "Skip Cloudflare purge"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: vps-frontend-production
      cancel-in-progress: false

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_FRONTEND_PATH: ${{ secrets.VPS_FRONTEND_PATH }}
      VPS_PM2_FRONTEND_APP: ${{ secrets.VPS_PM2_FRONTEND_APP }}
      VPS_FRONTEND_HEALTHCHECK_URL: ${{ secrets.VPS_FRONTEND_HEALTHCHECK_URL }}
      VPS_SSH_PRIVATE_KEY_PRESENT: ${{ secrets.VPS_SSH_PRIVATE_KEY != '' }}

    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          missing=()

          for key in VPS_HOST VPS_SSH_USER VPS_FRONTEND_PATH; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${VPS_SSH_PRIVATE_KEY_PRESENT}" != "true" ]; then
            missing+=("VPS_SSH_PRIVATE_KEY")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

          echo "SSH_PORT=${VPS_SSH_PORT:-22}"
          echo "PM2_APP=${VPS_PM2_FRONTEND_APP:-tinytale-web}"
          echo "HEALTH_URL=${VPS_FRONTEND_HEALTHCHECK_URL:-http://127.0.0.1:7001/zh}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts

          scanned=0
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p "${VPS_SSH_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              scanned=1
              echo "Known hosts entry added on attempt $attempt"
              break
            fi

            echo "ssh-keyscan attempt $attempt failed, retrying..."
            sleep 5
          done

          if [ "$scanned" -ne 1 ]; then
            echo "ssh-keyscan failed; deploy step will fallback to relaxed host checking"
          fi

      - name: Deploy frontend to VPS with rollback
        env:
          DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}
        run: |
          set -euo pipefail

          SSH_PORT="${VPS_SSH_PORT:-22}"
          PM2_APP="${VPS_PM2_FRONTEND_APP:-tinytale-web}"
          HEALTH_URL="${VPS_FRONTEND_HEALTHCHECK_URL:-http://127.0.0.1:7001/zh}"
          SSH_ARGS=(-p "$SSH_PORT" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)

          if ! ssh-keygen -F "$VPS_HOST" >/dev/null 2>&1; then
            echo "No known_hosts entry found for $VPS_HOST; falling back to relaxed host checking"
            SSH_ARGS+=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          fi

          run_remote_deploy() {
            ssh "${SSH_ARGS[@]}" "$VPS_SSH_USER@$VPS_HOST" \
              "VPS_FRONTEND_PATH='$VPS_FRONTEND_PATH' PM2_APP='$PM2_APP' HEALTH_URL='$HEALTH_URL' DEPLOY_REF='$DEPLOY_REF' bash -s" <<'EOF'
          set -Eeuo pipefail

          FRONTEND_LINK="$VPS_FRONTEND_PATH"
          BASE_DIR="$(dirname "$FRONTEND_LINK")"
          RELEASES_DIR="$BASE_DIR/releases"
          SHARED_DIR="$BASE_DIR/shared"
          CURRENT_LINK="$BASE_DIR/current"
          SHARED_PM2_ECOSYSTEM="$SHARED_DIR/ecosystem.frontend.cjs"
          SHARED_NPM_CACHE_DIR="$SHARED_DIR/npm-cache"
          SHARED_NEXT_CACHE_DIR="$SHARED_DIR/next-cache"
          LOCK_FILE="$BASE_DIR/deploy.lock"

          mkdir -p "$RELEASES_DIR" "$SHARED_DIR" "$SHARED_NPM_CACHE_DIR" "$SHARED_NEXT_CACHE_DIR"
          exec 9>"$LOCK_FILE"
          flock 9

          resolve_live_dir() {
            if [ -L "$CURRENT_LINK" ]; then
              readlink -f "$CURRENT_LINK"
              return
            fi

            if [ -e "$FRONTEND_LINK" ]; then
              readlink -f "$FRONTEND_LINK"
              return
            fi

            return 1
          }

          migrate_layout_if_needed() {
            if [ -L "$FRONTEND_LINK" ] && [ -L "$CURRENT_LINK" ]; then
              return
            fi

            if [ -d "$FRONTEND_LINK/.git" ]; then
              local legacy_sha
              local legacy_release

              legacy_sha="$(git -C "$FRONTEND_LINK" rev-parse --short HEAD)"
              legacy_release="$RELEASES_DIR/${legacy_sha}-legacy-$(date +%s)"
              mv "$FRONTEND_LINK" "$legacy_release"
              ln -sfn "$legacy_release" "$CURRENT_LINK"
              ln -sfn "$CURRENT_LINK" "$FRONTEND_LINK"
              return
            fi

            if [ -L "$FRONTEND_LINK" ] && [ ! -L "$CURRENT_LINK" ]; then
              ln -sfn "$(readlink -f "$FRONTEND_LINK")" "$CURRENT_LINK"
              ln -sfn "$CURRENT_LINK" "$FRONTEND_LINK"
              return
            fi

            echo "VPS_FRONTEND_PATH is not a git repository or managed symlink: $FRONTEND_LINK"
            exit 1
          }

          migrate_layout_if_needed

          PREV_LIVE_DIR="$(resolve_live_dir)"
          if [ ! -d "$PREV_LIVE_DIR/.git" ]; then
            echo "Live frontend release is missing .git metadata: $PREV_LIVE_DIR"
            exit 1
          fi

          PREV_SHA="$(git -C "$PREV_LIVE_DIR" rev-parse HEAD)"
          REMOTE_URL="$(git -C "$PREV_LIVE_DIR" remote get-url origin)"
          echo "Current frontend SHA: $(git -C "$PREV_LIVE_DIR" rev-parse --short "$PREV_SHA")"

          rollback() {
            local line="${1:-unknown}"
            trap - ERR

            echo "Deployment failed at line $line. Rolling back to $(git -C "$PREV_LIVE_DIR" rev-parse --short "$PREV_SHA")"
            ln -sfn "$PREV_LIVE_DIR" "$CURRENT_LINK" || true
            ln -sfn "$CURRENT_LINK" "$FRONTEND_LINK" || true
            pm2 reload "$PM2_APP" --update-env || pm2 restart "$PM2_APP" --update-env || true
            exit 1
          }

          trap 'rollback $LINENO' ERR

          git -C "$PREV_LIVE_DIR" fetch --prune origin

          # Prefer remote branch refs to avoid deploying stale local branches.
          if git -C "$PREV_LIVE_DIR" show-ref --verify --quiet "refs/remotes/origin/${DEPLOY_REF}"; then
            DEPLOY_REF="origin/${DEPLOY_REF}"
          elif ! git -C "$PREV_LIVE_DIR" cat-file -e "${DEPLOY_REF}^{commit}" 2>/dev/null; then
            echo "DEPLOY_REF ${DEPLOY_REF} not found; fallback to origin/main"
            DEPLOY_REF="origin/main"
          fi

          TARGET_FULL_SHA="$(git -C "$PREV_LIVE_DIR" rev-parse "$DEPLOY_REF")"
          TARGET_SHA="$(git -C "$PREV_LIVE_DIR" rev-parse --short "$TARGET_FULL_SHA")"
          TARGET_RELEASE="$RELEASES_DIR/${TARGET_SHA}-$(date +%s)"
          echo "Deploying target SHA: $TARGET_SHA"

          if [ -f "$PREV_LIVE_DIR/.env.production" ]; then
            cp -f "$PREV_LIVE_DIR/.env.production" "$SHARED_DIR/.env.production"
          fi

          git clone --no-checkout "$PREV_LIVE_DIR" "$TARGET_RELEASE"
          git -C "$TARGET_RELEASE" remote set-url origin "$REMOTE_URL"
          git -C "$TARGET_RELEASE" fetch --prune origin
          git -C "$TARGET_RELEASE" reset --hard "$TARGET_FULL_SHA"
          git -C "$TARGET_RELEASE" clean -fdx

          if [ -f "$SHARED_DIR/.env.production" ]; then
            cp -f "$SHARED_DIR/.env.production" "$TARGET_RELEASE/.env.production"
          fi

          cd "$TARGET_RELEASE"
          LOCKFILE_HASH="$(sha256sum package-lock.json | awk '{print $1}')"
          SHARED_DEPENDENCY_DIR="$SHARED_DIR/deps-$LOCKFILE_HASH"
          SHARED_NODE_MODULES_DIR="$SHARED_DEPENDENCY_DIR/node_modules"

          if [ -L node_modules ] || [ -d node_modules ]; then
            rm -rf node_modules
          fi

          if [ -d "$SHARED_NODE_MODULES_DIR" ] && [ -x "$SHARED_NODE_MODULES_DIR/.bin/next" ]; then
            echo "Reusing cached dependencies for lockfile $LOCKFILE_HASH"
          else
            echo "Installing dependencies for lockfile $LOCKFILE_HASH"
            rm -rf "$SHARED_DEPENDENCY_DIR"
            mkdir -p "$SHARED_DEPENDENCY_DIR"
            npm_config_cache="$SHARED_NPM_CACHE_DIR" npm ci --no-audit --no-fund
            mv node_modules "$SHARED_NODE_MODULES_DIR"
          fi

          ln -sfn "$SHARED_NODE_MODULES_DIR" node_modules

          rm -rf .next
          mkdir -p .next
          ln -sfn "$SHARED_NEXT_CACHE_DIR" .next/cache
          npm run build

          cat > "$SHARED_PM2_ECOSYSTEM" <<EOF_PM2
          module.exports = {
            apps: [
              {
                name: process.env.PM2_APP || "tinytale-web",
                cwd: process.env.FRONTEND_LINK || "$FRONTEND_LINK",
                script: "node_modules/next/dist/bin/next",
                args: "start -p 7001",
                interpreter: "node",
                env: {
                  NODE_ENV: "production",
                  PORT: "7001",
                },
              },
            ],
          };
          EOF_PM2

          ln -sfn "$TARGET_RELEASE" "$CURRENT_LINK"
          ln -sfn "$CURRENT_LINK" "$FRONTEND_LINK"
          FRONTEND_LINK="$FRONTEND_LINK" PM2_APP="$PM2_APP" pm2 startOrReload "$SHARED_PM2_ECOSYSTEM" --only "$PM2_APP" --update-env

          passed=0
          for attempt in 1 2 3 4 5; do
            status="$(curl -o /dev/null -s -w '%{http_code}' --max-time 10 "$HEALTH_URL" || true)"
            if [ "$status" = "200" ] || [ "$status" = "301" ] || [ "$status" = "302" ] || [ "$status" = "307" ] || [ "$status" = "308" ]; then
              passed=1
              echo "Health check passed (HTTP $status)"
              break
            fi

            echo "Health check attempt $attempt failed (HTTP $status), retrying..."
            sleep 5
          done

          if [ "$passed" -ne 1 ]; then
            echo "Health check failed after deployment"
            exit 1
          fi

          trap - ERR
          echo "Frontend deploy finished: $TARGET_SHA"
          EOF
          }

          deploy_exit_code=0
          for attempt in 1 2 3; do
            if run_remote_deploy; then
              deploy_exit_code=0
              break
            fi

            deploy_exit_code=$?
            if [ "$deploy_exit_code" -ne 255 ] || [ "$attempt" -eq 3 ]; then
              break
            fi

            echo "SSH deploy attempt $attempt failed with exit code $deploy_exit_code, retrying..."
            sleep $((attempt * 10))
          done

          if [ "$deploy_exit_code" -ne 0 ]; then
            exit "$deploy_exit_code"
          fi

      - name: Purge Cloudflare cache (optional)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_purge != 'true' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ZONE_ID:-}" ]; then
            echo "CF_API_TOKEN or CF_ZONE_ID not set, skipping purge"
            exit 0
          fi

          response="$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"

          echo "$response"
          if ! echo "$response" | grep '"success":true' >/dev/null; then
            echo "Cloudflare purge failed, continuing without blocking deployment"
            exit 0
          fi

      - name: Smoke check public site
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://tinytale.top/zh >/dev/null
          echo "Public smoke check passed"
